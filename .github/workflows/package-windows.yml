name: Paquete de Windows

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      OLLAMA_NO_CLOUD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verificar que la etiqueta pertenece a main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows-cpu.lock
      - name: Verificar que etiqueta y versión coinciden
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: python scripts/sync_version.py --check --release-tag $env:GITHUB_REF_NAME
      - name: Instalar dependencias bloqueadas
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-windows-cpu.lock
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Verificar variante CPU
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -c "import torch, torchvision; assert torch.version.cuda is None; print(torch.__version__, torchvision.__version__)"
          python -m pip check
          python scripts/audit_dependencies.py requirements-windows-cpu.lock --canonical-lock requirements.lock --allow-variant-skip torch --allow-variant-skip torchvision --ignore-vuln CVE-2026-54499
      - name: Validar el código antes de empaquetar
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/sync_version.py --check
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src/parsezen
          python -m pytest --cov=parsezen --cov-report=term-missing --cov-fail-under=88
      - name: Construir aplicación e instalador
        shell: pwsh
        run: .\distribution\windows\build.ps1 -InstallInnoSetup
      - name: Crear inventario de dependencias
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -X utf8 -m pip inspect --local | Out-File -Encoding utf8NoBOM "outputs\python-environment.json"
          python -X utf8 -m json.tool "outputs\python-environment.json" > $null
      - name: Crear checksum del instalador
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $installers = @(Get-ChildItem -Path "outputs" -Filter "Parsezen-Setup-*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Se esperaba exactamente un instalador de Parsezen."
          }
          $installer = $installers[0]
          $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($installer.Name)" |
            Out-File -Encoding ascii -NoNewline "$($installer.FullName).sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: Parsezen-Windows
          path: |
            outputs/Parsezen-Setup-*.exe
            outputs/Parsezen-Setup-*.exe.sha256
            outputs/python-environment.json
          if-no-files-found: error

  publish:
    name: Publicar release verificada
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Parsezen-Windows
          path: outputs
      - name: Atestar la procedencia del instalador
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: outputs/Parsezen-Setup-*.exe
      - name: Crear o actualizar la Release en borrador
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = @(Get-ChildItem -Path "outputs" -Filter "Parsezen-Setup-*.exe" -File)
          if ($installer.Count -ne 1) {
            throw "Se esperaba exactamente un instalador de Parsezen."
          }
          $releaseFiles = @(
            $installer[0].FullName,
            "$($installer[0].FullName).sha256",
            (Resolve-Path "outputs\python-environment.json").Path
          )
          $nativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:GITHUB_REF_NAME 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
          if ($releaseExists) {
            gh release upload $env:GITHUB_REF_NAME @releaseFiles --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @releaseFiles --draft --verify-tag --generate-notes --title "Parsezen $env:GITHUB_REF_NAME"
          }
